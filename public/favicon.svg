<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="pharmacyGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4F46E5" />
      <stop offset="50%" stop-color="#6366F1" />
      <stop offset="100%" stop-color="#10B981" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#10B981" flood-opacity="0.4" />
    </filter>
  </defs>

  <!-- Background rounded squircle -->
  <rect width="64" height="64" rx="16" fill="url(#pharmacyGrad)" />

  <!-- Inner subtle border -->
  <rect x="1" y="1" width="62" height="62" rx="15" fill="none" stroke="#FFFFFF" stroke-opacity="0.2" stroke-width="2" />

  <!-- Medical Cross Symbol -->
  <g filter="url(#glow)">
    <!-- Vertical Cross Bar -->
    <rect x="26" y="14" width="12" height="36" rx="4" fill="#FFFFFF" />
    <!-- Horizontal Cross Bar -->
    <rect x="14" y="26" width="36" height="12" rx="4" fill="#FFFFFF" />
  </g>

  <!-- Center Accent Heart / Pill Core -->
  <circle cx="32" cy="32" r="3.5" fill="#10B981" />
</svg>
